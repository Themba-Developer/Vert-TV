[package]
name = "vert-adblock-bridge"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"

[lib]
name = "vert_adblock"
crate-type = ["cdylib", "rlib"]

[dependencies]
adblock = { version = "=0.13.3", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
jni = "=0.21.1"
serde_json = "1"

[profile.release]
opt-level = 2
lto = "thin"
strip = "debuginfo"
